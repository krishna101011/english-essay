# nginx reverse-proxy template for a small VPS deployment.
# Not installed by this repo — copy to /etc/nginx/sites-available/english-essay,
# symlink into sites-enabled, replace your-domain.example with the real
# domain, then run certbot (see docs/phase-3-deployment.md) to fill in the
# ssl_certificate lines and add the port-80-to-443 redirect. This file is
# deliberately left HTTP-only/untouched by certbot so it's inert until you
# run certbot yourself against a real domain.

server {
    listen 80;
    server_name your-domain.example;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /opt/english-essay/app/static/;
    }
}
