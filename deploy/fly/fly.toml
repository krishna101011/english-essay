# Reference Fly.io app config. Not registered or deployed by this repo —
# rename the `app` value, then run `fly launch --no-deploy` to attach a
# real Fly app, `fly volumes create` for the SQLite data directory, `fly
# secrets set` for SESSION_SECRET_KEY/ENCRYPTION_KEY, and `fly deploy`
# yourself when you're ready.

app = "your-app-name"
primary_region = "iad"

[build]
  dockerfile = "deploy/fly/Dockerfile"

[env]
  APP_ENV = "production"
  DATABASE_URL = "sqlite:////data/app.db"

[[mounts]]
  source = "english_essay_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
