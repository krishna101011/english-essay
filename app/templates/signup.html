{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-white border border-slate-200 rounded-lg p-6">
    <h1 class="text-xl font-semibold mb-4">Create an account</h1>
    {% if error %}
    <p class="text-red-600 text-sm mb-4" role="alert">{{ error }}</p>
    {% endif %}
    <form method="post" action="/signup" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
        <div class="absolute -left-[9999px] w-px h-px overflow-hidden" aria-hidden="true">
            <label for="website">Leave this field blank</label>
            <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1" for="email">Email</label>
            <input class="w-full border border-slate-300 rounded px-3 py-2" type="email" id="email" name="email" required>
        </div>
        <div>
            <label class="block text-sm font-medium mb-1" for="password">Password</label>
            <input class="w-full border border-slate-300 rounded px-3 py-2" type="password" id="password" name="password" minlength="8" required>
            <p class="text-xs text-slate-500 mt-1">At least 8 characters.</p>
        </div>
        <button class="w-full bg-indigo-600 text-white rounded py-2 font-medium hover:bg-indigo-700" type="submit">Sign up</button>
    </form>
    <p class="text-sm text-slate-500 mt-4">Already have an account? <a class="text-indigo-700" href="/login">Log in</a></p>
</div>
{% endblock %}
