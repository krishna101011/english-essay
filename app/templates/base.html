<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}English Essay Coach{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
    <nav class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between">
        <a href="/" class="font-semibold text-lg text-indigo-700">English Essay Coach</a>
        {% if request.session.get("user_id") %}
        <div class="flex items-center gap-4 text-sm">
            <a href="/" class="hover:text-indigo-700">Editor</a>
            <a href="/history" class="hover:text-indigo-700">History</a>
            <a href="/vocab" class="hover:text-indigo-700">Vocabulary</a>
            <a href="/settings" class="hover:text-indigo-700">Settings</a>
            <form action="/logout" method="post">
                <button type="submit" class="text-slate-500 hover:text-red-600">Log out</button>
            </form>
        </div>
        {% else %}
        <div class="flex items-center gap-4 text-sm">
            <a href="/login" class="hover:text-indigo-700">Log in</a>
            <a href="/signup" class="hover:text-indigo-700">Sign up</a>
        </div>
        {% endif %}
    </nav>
    <main class="flex-1 max-w-4xl w-full mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
