{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-white border border-slate-200 rounded-lg p-6">
    <h1 class="text-xl font-semibold mb-1">Reset your password</h1>
    <p class="text-sm text-slate-500 mb-4">Enter your account email and we'll send you a reset link.</p>
    {% if message %}
    <p class="text-green-700 text-sm mb-4">{{ message }}</p>
    {% endif %}
    <form method="post" action="/forgot-password" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
        <div>
            <label class="block text-sm font-medium mb-1" for="email">Email</label>
            <input class="w-full border border-slate-300 rounded px-3 py-2" type="email" id="email" name="email" required>
        </div>
        <button class="w-full bg-indigo-600 text-white rounded py-2 font-medium hover:bg-indigo-700" type="submit">Send reset link</button>
    </form>
    <p class="text-sm text-slate-500 mt-4"><a class="text-indigo-700" href="/login">Back to log in</a></p>
</div>
{% endblock %}
