{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-white border border-slate-200 rounded-lg p-6">
    <h1 class="text-xl font-semibold mb-4">Choose a new password</h1>
    {% if error %}
    <p class="text-red-600 text-sm mb-4">{{ error }}</p>
    {% endif %}
    <form method="post" action="/reset-password" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
        <input type="hidden" name="token" value="{{ token }}">
        <div>
            <label class="block text-sm font-medium mb-1" for="password">New password</label>
            <input class="w-full border border-slate-300 rounded px-3 py-2" type="password" id="password" name="password" minlength="8" required>
            <p class="text-xs text-slate-500 mt-1">At least 8 characters.</p>
        </div>
        <button class="w-full bg-indigo-600 text-white rounded py-2 font-medium hover:bg-indigo-700" type="submit">Reset password</button>
    </form>
</div>
{% endblock %}
